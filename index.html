<style>
:root{
  --paper:#EDF0E7; --panel:#fff; --ink:#152018; --green:#2B6B4F;
  --soft:#DFEAE1; --clay:#B4462F; --muted:#78877C; --line:#D6DDD1;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono: ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 108px}

.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.back{background:none;border:none;color:var(--green);font-size:15px;font-weight:600;padding:6px 4px}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);
  padding:11px 16px;border-radius:10px;font-size:15px;font-weight:600}
.btn.sm{padding:8px 13px;font-size:14px}
.btn.solid{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--clay);border-color:var(--clay)}
.btn.wide{width:100%}

.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:4px;gap:4px;margin-bottom:12px}
.tabs button{flex:1;border:none;background:none;padding:10px 8px;border-radius:9px;
  font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}

.datestrip{display:flex;align-items:center;justify-content:space-between;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:14px}
.arrow{background:none;border:none;font-size:26px;line-height:1;padding:4px 16px;color:var(--ink)}
.arrow[disabled]{opacity:.25}
.dlabel{text-align:center}
.dlabel b{display:block;font-size:15px;font-weight:700}
.dlabel span{font-family:var(--mono);font-size:11px;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile{display:block;width:100%;border:none;background:none;padding:0;text-align:left}
.thumb{position:relative;aspect-ratio:1/1;background:var(--soft) center/cover no-repeat;
  display:grid;place-items:center}
.thumb i{font-style:normal;font-size:40px;font-weight:800;color:var(--green);opacity:.45}
.thumb .stack{display:grid;place-items:center;gap:2px;padding:6px}
.thumb .stack i{font-size:15px;opacity:.5}
.thumb .big{font-family:var(--mono);font-weight:700;letter-spacing:-.02em;
  font-size:clamp(21px,7.6vw,32px);line-height:1.1;color:var(--green)}
.thumb .big.over{position:absolute;left:0;right:0;bottom:0;margin:0;padding:26px 8px 9px;
  text-align:center;color:#fff;
  background:linear-gradient(to top,rgba(21,32,24,.86),rgba(21,32,24,.55) 55%,rgba(21,32,24,0))}
.tile .meta{padding:10px 12px 12px}
.tile .meta b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.tile .meta .amt{font-family:var(--mono);font-size:13px;color:var(--green);margin-top:2px}
.tile .meta .sub{font-size:12px;color:var(--muted)}

.salecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-top:12px}
.salecard .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-bottom:8px}
.salecard input{width:100%;padding:12px 14px;font-family:var(--mono);font-size:24px;font-weight:600;
  color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px}

.sheetrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.sheetrow:last-child{border-bottom:none}
.sheetrow label{flex:1;font-size:14px;font-weight:600;letter-spacing:.01em}
.sheetrow input{width:132px;padding:9px 11px;text-align:right;font-family:var(--mono);
  font-size:17px;font-weight:600;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:9px}
.sheetrow.tot{background:var(--soft);border-bottom:none}
.sheetrow.tot label{font-size:15px;font-weight:700}
.sheetrow.tot .v{width:132px;text-align:right;font-family:var(--mono);font-size:22px;
  font-weight:600;color:var(--green)}
.note{font-size:12px;color:var(--muted);margin:10px 2px 0;line-height:1.5}
.diffcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  margin-top:12px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.diffcard .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:600}
.diffcard .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}
.diffcard .v{margin-left:auto;font-family:var(--mono);font-size:38px;font-weight:700;
  letter-spacing:-.02em;white-space:nowrap}
.diffcard .v.up{color:var(--green)}
.diffcard .v.down{color:var(--clay)}
.diffcard .v.flat{color:var(--muted)}

.cathead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cathead .thumb{width:52px;height:52px;aspect-ratio:auto;border-radius:12px;flex:0 0 auto}
.cathead .thumb i{font-size:17px}
.cathead b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.cathead span{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--green)}

.rows{display:grid;gap:8px}
.row{display:block;width:100%;background:none;border:none;padding:13px 14px 12px;text-align:left}
.rowtop{display:flex;align-items:baseline;gap:8px}
.rowtop b{font-size:17px;font-weight:700;flex:1}
.rowtop .price{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats{display:flex;gap:18px;margin-top:10px;align-items:flex-end}
.stat .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:600}
.stat.big .v{font-size:21px}
.stat.left .v{color:var(--clay)}
.spacer{flex:1}
.rowamt{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--green)}
.bar{height:5px;border-radius:5px;background:var(--soft);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .25s ease}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.card.moved{background:var(--soft);border-color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
.card.moved .rowtop .price{color:var(--green)}
.divider{display:flex;align-items:center;gap:10px;margin:16px 2px 8px;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.movers{display:flex;gap:6px;padding:0 12px 11px}
.movers button{flex:1;padding:7px 0;border:1px solid var(--line);background:var(--paper);
  border-radius:8px;font-size:15px;font-weight:700;color:var(--ink)}
.movers button[disabled]{opacity:.28}

.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center}
.empty b{display:block;font-size:17px;font-weight:700;margin-bottom:4px}
.empty p{font-size:14px;color:var(--muted);margin:0 0 14px}

.totalbar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
.totalbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center}
.totalbar .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;font-weight:600}
.totalbar .d{font-size:12px;opacity:.55}
.totalbar .v{font-family:var(--mono);font-size:28px;font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(21,32,24,.45);display:flex;align-items:flex-end;
  justify-content:center;z-index:50}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-size:20px;font-weight:700;margin:0 0 16px}
label.f{display:block}
label.f .k{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:6px}
label.f input{width:100%;padding:12px 14px;font-size:16px;font-weight:500;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:10px;font-family:var(--sans)}
label.f input.num{font-family:var(--mono);font-size:22px}
label.f.auto input{background:var(--soft);border-style:dashed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calcrow{padding:11px 14px;border-bottom:1px solid var(--line)}
.calcrow .head{display:flex;align-items:center;gap:12px}
.calcrow .head label{flex:1;font-size:14px;font-weight:600}
.calcrow input{width:170px;padding:9px 11px;text-align:right;font-family:var(--mono);
  font-size:17px;font-weight:600;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:9px}
.ops{display:flex;gap:6px;margin-top:9px}
.ops button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--paper);
  border-radius:9px;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink)}
.ops button.clr{color:var(--clay);border-color:var(--clay)}
.soldbar{display:flex;align-items:center;gap:10px;margin-top:7px}
.soldbar .eq{flex:1;text-align:left;margin-top:0}
.eq{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:600;
  text-align:right;margin-top:7px;min-height:16px}
.salecard .lbl{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.salecard .lbl .k{margin:0;flex:1}
.salecard .lbl input.nm{flex:1;padding:7px 10px;font-size:14px;font-weight:600;
  background:var(--paper);border:1px solid var(--line);border-radius:8px}
.pick{display:flex;gap:8px;margin-top:6px}
.pick button{flex:1;padding:11px 8px;border:1px solid var(--line);background:var(--paper);
  border-radius:10px;font-size:15px;font-weight:600;color:var(--muted)}
.pick button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.soldwrap{margin-top:12px}
.preview{background:var(--soft);border-radius:12px;padding:14px 16px;margin:16px 0;display:flex;align-items:center}
.preview .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--green);font-weight:600}
.preview .calc{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:3px}
.preview .amt{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--green)}
.actions{display:flex;gap:10px;margin-top:18px;align-items:center}
.photo{height:150px;border-radius:12px;background:var(--soft) center/cover no-repeat;
  display:grid;place-items:center;margin-bottom:12px;color:var(--muted);font-size:14px}
.filebtn{display:block;text-align:center;padding:11px 16px;border:1px solid var(--line);
  border-radius:10px;font-size:15px;font-weight:600}
.notice{background:#FBE9E4;border:1px solid var(--clay);color:var(--clay);border-radius:10px;
  padding:10px 12px;font-size:14px;margin-bottom:14px}
.install{position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));
  max-width:532px;margin:0 auto;background:var(--panel);border:1px solid var(--green);
  border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:40;
  box-shadow:0 6px 20px rgba(21,32,24,.14)}
.install p{margin:0;flex:1;font-size:14px;font-weight:500}
</style>

<body>
<div id="wrap"></div>
<div id="bar"></div>
<div id="modal"></div>
<div id="install"></div>

<script>
/* ---------------- defaults ---------------- */
var DEFAULTS = {
  categories: [
    { id:"ol", name:"OL", image:null },
    { id:"cg", name:"CG", image:null }
  ],
  items: []
};

/* rows of the shift report, in the order they appear on the paper form */
var REPORT_ROWS = [
  { id:"cash",   label:"TOTAL CASH" },
  { id:"credit", label:"CREDIT CARDS" },
  { id:"inside", label:"INSIDE CARDS" },
  { id:"fleet",  label:"FLEET CARDS" },
  { id:"csale",  label:"CREDIT SALE" },
  { id:"misc",   label:"MISC. EXP. / PAID OUT" },
  { id:"change", label:"CHANGE" }
];

var config, days, sheets, notice = "";
var view = { tab:"counts", cat:null, editing:false, date:todayKey(), sheet:null, draft:null };
var deferredInstall = null;

/* ---------------- dates ---------------- */
function todayKey(){ return keyOf(new Date()); }
function keyOf(d){
  var p = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function shift(key, delta){
  var a = key.split("-").map(Number);
  return keyOf(new Date(a[0], a[1]-1, a[2]+delta));
}
function pretty(key){
  if (key === todayKey()) return "Today";
  var a = key.split("-").map(Number);
  return new Date(a[0],a[1]-1,a[2])
    .toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function money(n){
  return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){
  return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ---------------- storage ---------------- */
function load(){
  try { config = JSON.parse(localStorage.getItem("daycount:config")) || DEFAULTS; }
  catch(e){ config = DEFAULTS; }
  try { days = JSON.parse(localStorage.getItem("daycount:days")) || {}; }
  catch(e){ days = {}; }
  try { sheets = JSON.parse(localStorage.getItem("daycount:sheets")) || {}; }
  catch(e){ sheets = {}; }
}
function saveConfig(){
  try { localStorage.setItem("daycount:config", JSON.stringify(config)); notice=""; }
  catch(e){ notice = "Storage is full. Remove a group photo to free up space."; }
}
function saveDays(){
  try { localStorage.setItem("daycount:days", JSON.stringify(days)); notice=""; }
  catch(e){ notice = "Couldn't save that count. Storage is full."; }
}
function saveSheets(){
  try { localStorage.setItem("daycount:sheets", JSON.stringify(sheets)); notice=""; }
  catch(e){ notice = "Couldn't save that entry. Storage is full."; }
}

/* ---------------- maths ---------------- */
function entriesFor(){ return days[view.date] || {}; }
function sheetFor(){ return sheets[view.date] || {}; }

function has(v){ return v !== undefined && v !== null && String(v).trim() !== ""; }

function derive(e){
  e = e || {};
  var inQty = Number(e.inQty) || 0;
  var addQty = Number(e.addQty) || 0;
  var avail = inQty + addQty;              /* opening stock plus anything put out today */
  var counted = has(e.inQty);
  var left, sold;

  if (has(e.soldQty)){                     /* sold was typed or derived */
    sold = Math.max(0, Number(e.soldQty) || 0);
    left = has(e.outQty) ? (Number(e.outQty)||0) : Math.max(0, avail - sold);
  } else if (has(e.outQty)){               /* only the closing count is known */
    left = Number(e.outQty) || 0;
    sold = Math.max(0, avail - left);
  } else {                                 /* opening count only - nothing moved yet */
    left = avail;
    sold = 0;
  }
  return { inQty:inQty, addQty:addQty, avail:avail, left:left, sold:sold, counted:counted };
}

function calc(item){
  var d = derive(entriesFor()[item.id]);
  d.amount = d.sold * (Number(item.price)||0);
  d.seq = (entriesFor()[item.id] || {}).seq;
  return d;
}
function catTotal(id){
  return config.items.filter(function(i){ return i.catId===id; })
    .reduce(function(s,i){ return s + calc(i).amount; }, 0);
}
function grandTotal(){
  var items = config.items.reduce(function(s,i){ return s + calc(i).amount; }, 0);
  return items + (Number(sheetFor().totalSale) || 0) + extrasTotal();
}
/* works out things like 500+200-50 or 12*4 without using eval */
function evalExpr(raw){
  var s = String(raw === undefined || raw === null ? "" : raw)
            .replace(/[\u00d7x]/gi, "*").replace(/[\u00f7]/g, "/")
            .replace(/[\u2212\u2013]/g, "-").replace(/\s+/g, "");
  if (!s) return 0;
  s = s.replace(/[+\-*\/.]+$/, "");                 /* ignore a dangling operator */
  if (!s || !/^-?[0-9.]+([+\-*\/][0-9.]+)*$/.test(s)) return Number(s) || 0;

  var nums = [], ops = [], buf = "", i = 0;
  if (s[0] === "-"){ buf = "-"; i = 1; }
  for (; i < s.length; i++){
    var ch = s[i];
    if ("+-*/".indexOf(ch) > -1){ nums.push(Number(buf) || 0); ops.push(ch); buf = ""; }
    else buf += ch;
  }
  nums.push(Number(buf) || 0);

  for (var j = 0; j < ops.length; ){          /* multiply and divide first */
    if (ops[j] === "*" || ops[j] === "/"){
      var r = ops[j] === "*" ? nums[j] * nums[j+1]
                             : (nums[j+1] === 0 ? 0 : nums[j] / nums[j+1]);
      nums.splice(j, 2, r); ops.splice(j, 1);
    } else j++;
  }
  var out = nums[0];
  for (var k = 0; k < ops.length; k++)
    out = ops[k] === "+" ? out + nums[k+1] : out - nums[k+1];
  return out;
}

function isExpr(v){ return /[+\-*\/\u00d7\u00f7]/.test(String(v || "").slice(1)); }

function reportTotal(){
  var s = sheetFor();
  return REPORT_ROWS.reduce(function(sum,r){
    return sum + (r.id === "cash" ? evalExpr(s.cash) : (Number(s[r.id]) || 0));
  }, 0);
}

/* the manual boxes on the Counts tab: Total sale plus any you add */
function extrasTotal(){
  var s = sheetFor();
  return (config.extras || []).reduce(function(sum,x){
    return sum + (Number(s["x_" + x.id]) || 0);
  }, 0);
}

/* ---------------- image ---------------- */
function shrink(file, cb, onErr){
  var r = new FileReader();
  r.onerror = function(){ onErr("Could not read that image."); };
  r.onload = function(){
    var img = new Image();
    img.onerror = function(){ onErr("Could not open that image."); };
    img.onload = function(){
      var max = 520, s = Math.min(1, max/Math.max(img.width,img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg", 0.72));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ---------------- render ---------------- */
function thumbStyle(img){ return img ? ' style="background-image:url('+img+')"' : ""; }

function render(){

  var cat = config.categories.filter(function(k){ return k.id===view.cat; })[0] || null;
  var h = "";

  h += '<div class="topbar">';

    h += '<button class="btn sm'+(view.editing?" solid":"")+'" data-a="toggle-edit">'+
         (view.editing?"Done":"Edit")+"</button>";
  h += "</div>";

  /* tabs, home only */

             '<input id="r-cash" class="rin" data-k="cash" inputmode="decimal" '+
             'enterkeyhint="next" placeholder="0.00" value="'+esc(s.cash)+'"></div>'+
             '<div class="ops">'+
             '<button data-a="cash-op" data-id="+">+</button>'+
             '<button data-a="cash-op" data-id="-">\u2212</button>'+
             '<button data-a="cash-op" data-id="*">\u00d7</button>'+
             '<button data-a="cash-op" data-id="/">\u00f7</button>'+
             '<button class="clr" data-a="cash-op" data-id="C">C</button></div>'+
             '<div class="eq" id="cash-eq"></div></div>';
        return;
      }
      h += '<div class="sheetrow"><label for="r-'+r.id+'">'+r.label+"</label>"+
           '<input id="r-'+r.id+'" class="rin" data-k="'+r.id+'" inputmode="decimal" '+
           'enterkeyhint="next" placeholder="0.00" value="'+esc(s[r.id])+'"></div>';
    });

         '<div class="v" id="r-total">'+money(reportTotal())+"</div></div></div>";
    h += diffCardHTML();
    h += '<p class="note">Every box is yours to type in. TOTAL AMOUNTS adds all seven '+
         "rows together as you go. Entries save on their own and are kept per day.</p>";
    wrap.innerHTML = h;
    wireReport();
    renderBar(null);
    renderSheet();
    renderInstall();

    h += '<div class="grid">';
    config.categories.forEach(function(k){

      h += '<div class="card"><button class="tile" data-a="'+(view.editing?"edit-cat":"open-cat")+'" data-id="'+k.id+'">'+
           '<div class="thumb"'+thumbStyle(k.image)+">"+

             ? '<div class="big over">'+tot+"</div>"

               '<div class="big">'+tot+"</div></div>")+

           '<div class="meta"><b>'+esc(k.name)+"</b>"+
           '<div class="sub">'+config.items.filter(function(i){return i.catId===k.id;}).length+" items</div>"+

        h += '<div style="padding:0 12px 12px"><button class="btn wide" style="padding:8px;font-size:13px" data-a="edit-cat" data-id="'+k.id+'">Edit group</button></div>';
      h += "</div>";
    });
    h += "</div>";
    if (view.editing) h += '<button class="btn wide" style="margin-top:12px" data-a="add-cat">+ Add a group</button>';

    h += '<div class="salecard"><div class="k">Total sale</div>'+

      h += '<div class="salecard"><div class="lbl">';

             'placeholder="Box name">'+
             '<button class="btn sm danger" data-a="del-extra" data-id="'+x.id+'">Remove</button>';
      } else {
        h += '<div class="k">'+esc(x.name)+"</div>";
      }
      h += "</div>"+
           '<input class="xval" data-id="'+x.id+'" inputmode="decimal" enterkeyhint="done" '+
           'placeholder="0.00" value="'+esc(sheetFor()["x_"+x.id])+'"></div>';

    if (view.editing)
      h += '<button class="btn wide" style="margin-top:8px" data-a="add-extra">'+
           "+ Add an entry box</button>";

    h += '<button class="btn wide" style="margin-top:8px" data-a="backup">'+
         "Backup &amp; restore</button>";

  /* ---- inside a category ---- */
  if (cat){

         "<div><b>"+esc(cat.name)+"</b><span>"+money(catTotal(cat.id))+" today</span></div></div>";

    var items = config.items.filter(function(i){ return i.catId===cat.id; });
    if (!view.editing) items = items.map(function(it, idx){ return { it:it, idx:idx, c:calc(it) }; })
      .sort(function(a,b){
        var as = a.c.sold > 0, bs = b.c.sold > 0;
        if (as !== bs) return as ? -1 : 1;  /* sold ones rise */
        return a.idx - b.idx;               /* both groups keep the group's own order */
      })
      .map(function(x){ return x.it; });
    if (!items.length){
      h += '<div class="empty"><b>No items here yet</b><p>Add your first item and set its price.</p>'+
           '<button class="btn solid" data-a="new-item">Add an item</button></div>';
    } else {
      h += '<div class="rows">';
      var seenUnsold = false;
      items.forEach(function(item){
        var c = calc(item);
        var pct = c.avail>0 ? Math.min(100, c.sold/c.avail*100) : 0;
        if (!view.editing && c.sold <= 0 && !seenUnsold){
          seenUnsold = true;
          if (items.some(function(x){ return calc(x).sold > 0; }))
            h += '</div><div class="divider">Not sold yet</div><div class="rows">';
        }
        h += '<div class="card'+(!view.editing && c.sold>0?" moved":"")+'"><button class="row" data-a="'+(view.editing?"edit-item":"count")+'" data-id="'+item.id+'">'+
             '<div class="rowtop"><b>'+esc(item.name)+'</b><span class="price">@ '+money(item.price)+"</span></div>";
        if (c.counted){
          h += '<div class="stats">'+
               '<div class="stat"><div class="k">In</div><div class="v">'+c.inQty+
                 (c.addQty>0?' <span style="color:var(--green);font-size:13px">+'+c.addQty+"</span>":"")+
                 "</div></div>"+
               '<div class="stat left"><div class="k">Left</div><div class="v">'+c.left+"</div></div>"+
               '<div class="stat big"><div class="k">Sold</div><div class="v">'+c.sold+"</div></div>"+
               '<div class="spacer"></div><div class="rowamt">'+money(c.amount)+"</div></div>"+
               '<div class="bar"><i style="width:'+pct+'%"></i></div>';
        } else {
          h += '<div class="hint">'+(view.editing?"Tap to rename or change the price":"Tap to enter today's count")+"</div>";
        }
        h += "</button>";
        if (view.editing){
          var pos = items.indexOf(item);
          h += '<div class="movers">'+
               '<button data-a="move-up" data-id="'+item.id+'"'+(pos===0?" disabled":"")+
               ">&#9650;</button>"+
               '<button data-a="move-down" data-id="'+item.id+'"'+
               (pos===items.length-1?" disabled":"")+">&#9660;</button></div>";
        }
        h += "</div>";
      });
      h += "</div>";
      h += '<button class="btn wide" style="margin-top:12px" data-a="new-item">+ Add an item</button>';
    }
  }

  wrap.innerHTML = h;
  if (!cat) wireTotalSale();
  renderBar(cat);
  renderSheet();
  renderInstall();
}

/* extra in the shift report is + and green, a shortfall is - and red */
function diffState(){
  var gap = reportTotal() - grandTotal();
  return {
    gap:  gap,
    cls:  gap > 0.004 ? "up"    : (gap < -0.004 ? "down" : "flat"),
    sign: gap > 0.004 ? "+"     : (gap < -0.004 ? "\u2212" : ""),
    word: gap > 0.004 ? "over"  : (gap < -0.004 ? "short" : "level")
  };
}

function diffCardHTML(){
  var st = diffState();
  var d = st.gap, cls = st.cls, sign = st.sign;
  return '<div class="diffcard"><div><div class="k">Difference</div>'+
         '<div class="sub" id="d-sub">'+diffSub()+"</div></div>"+
         '<div class="v '+cls+'" id="d-val">'+sign+money(Math.abs(d))+"</div></div>";
}

function diffSub(){
  return "shift " + money(reportTotal()) + "  \u00b7  counts " + money(grandTotal()) +
         "  \u00b7  " + diffState().word;
}

function paintDiff(){
  var val = document.getElementById("d-val");
  if (!val) return;
  var st = diffState();
  val.className = "v " + st.cls;
  val.textContent = st.sign + money(Math.abs(st.gap));
  document.getElementById("d-sub").textContent = diffSub();
}

function renderBar(cat){
  var label, value;
  if (!cat && view.tab === "report"){ label = "Total amounts"; value = reportTotal(); }
  else if (cat){ label = cat.name + " total"; value = catTotal(cat.id); }
  else { label = "Day total"; value = grandTotal(); }
  document.getElementById("bar").innerHTML =
    '<div class="totalbar"><div class="in"><div>'+
    '<div class="k">'+esc(label)+"</div>"+
    '<div class="d">'+pretty(view.date)+"</div></div>"+
    '<div class="spacer"></div><div class="v">'+money(value)+"</div></div></div>";
}

/* live-saving fields on the report tab */
function paintCashEq(){
  var el = document.getElementById("cash-eq");
  if (!el) return;
  var raw = (document.getElementById("r-cash") || {}).value || "";
  el.textContent = isExpr(raw) ? "= " + money(evalExpr(raw)) : "";
}

function wireReport(){
  var boxes = Array.prototype.slice.call(document.querySelectorAll(".rin"));
  boxes.forEach(function(el, idx){
    el.addEventListener("input", function(){
      sheets[view.date] = sheets[view.date] || {};
      sheets[view.date][el.dataset.k] = el.value;
      saveSheets();
      document.getElementById("r-total").textContent = money(reportTotal());
      paintCashEq();
      paintDiff();
      renderBar(null);
    });
    /* Enter drops you into the next row instead of shutting the keyboard */
    el.addEventListener("keydown", function(ev){
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      var next = boxes[idx + 1];
      if (next) next.focus(); else el.blur();
    });
  });
  paintCashEq();
}

function wireExtras(){
  Array.prototype.forEach.call(document.querySelectorAll(".xval"), function(el){
    el.addEventListener("input", function(){
      sheets[view.date] = sheets[view.date] || {};
      sheets[view.date]["x_" + el.dataset.id] = el.value;
      saveSheets();
      renderBar(null);
    });
    el.addEventListener("keydown", function(ev){
      if (ev.key === "Enter"){ ev.preventDefault(); el.blur(); }
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".xname"), function(el){
    el.addEventListener("input", function(){
      config.extras = (config.extras || []).map(function(x){
        return x.id === el.dataset.id ? { id:x.id, name:el.value } : x;
      });
      saveConfig();
    });
  });
}

function wireTotalSale(){
  wireExtras();
  var el = document.getElementById("totalsale");
  if (!el) return;
  el.addEventListener("input", function(){
    sheets[view.date] = sheets[view.date] || {};
    sheets[view.date].totalSale = el.value;
    saveSheets();
    renderBar(null);          /* day total keeps up as you type */
  });
  /* Enter / the go arrow just tucks the keyboard away - no navigating off */
  el.addEventListener("keydown", function(ev){
    if (ev.key === "Enter"){ ev.preventDefault(); el.blur(); }
  });
}

/* ---------------- sheets ---------------- */
function renderSheet(){

    var inStart = e.inQty, carried = null;

         '<input id="f-in" class="num" inputmode="decimal" placeholder="0" value="'+esc(inStart)+'"></label>'+
         '<label class="f" id="w-out"><span class="k">Out &mdash; left</span>'+
         '<input id="f-out" class="num" inputmode="decimal" placeholder="0" value="'+esc(e.outQty)+'"></label>'+
         "</div>"+
         '<div class="soldwrap"><label class="f" id="w-sold"><span class="k">Sold</span>'+
         '<input id="f-sold" class="num" inputmode="decimal" enterkeyhint="next" '+
         'placeholder="0" value="'+esc(soldPrefill)+'"></label>'+
         '<div class="soldbar"><div class="eq" id="sold-eq"></div>'+
         '<button id="f-soldclr" class="btn sm">Clear</button></div></div>'+
         '<div class="soldwrap"><label class="f"><span class="k">Additional stock &mdash; optional</span>'+
         '<input id="f-add" class="num" inputmode="decimal" tabindex="-1" '+
         'enterkeyhint="next" placeholder="0" value="'+esc(e.addQty)+'"></label></div>'+
         (carried ? '<p class="note" style="margin-top:8px">Opening count carried over from '+
            pretty(carried.date)+"'s closing figure. Change it if the shelf says otherwise.</p>" : "")+
         '<div class="preview"><div><div class="k">Amount</div>'+
         '<div class="calc" id="p-calc"></div></div>'+
         '<div class="spacer"></div><div class="amt" id="p-amt">0.00</div></div>'+
         '<div class="actions"><button class="btn" style="flex:1" data-a="close">Cancel</button>'+
         '<button class="btn solid" style="flex:2" data-a="save-count" data-id="'+item.id+'">Save count</button></div>';
  }

  if (s.kind === "outlist"){
    h += "<h2>Out counts &mdash; "+pretty(view.date)+"</h2>";
    var any = false;
    config.categories.forEach(function(k){
      var list = config.items.filter(function(i){ return i.catId===k.id; });
      if (!list.length) return;
      any = true;
      h += '<div class="divider" style="margin-top:14px">'+esc(k.name)+"</div>";
      h += '<div class="card">';
      list.forEach(function(it){
        var c = calc(it);
        h += '<div class="sheetrow"><label>'+esc(it.name)+"</label>"+
             '<div style="width:70px;text-align:right;font-family:var(--mono);font-size:19px;'+
             'font-weight:600;color:'+(c.counted?"var(--ink)":"var(--muted)")+'">'+
             (c.counted ? c.left : "\u2014")+"</div></div>";
      });
      h += "</div>";
    });
    if (!any) h += '<p class="note">No items yet.</p>';
    h += '<p class="note">Out is what is left at close. A dash means that item has not been '+
         "counted today.</p>"+
         '<div class="actions"><div class="spacer"></div>'+
         '<button class="btn solid" data-a="close">Close</button></div>';
  }

           '<div class="actions"><button class="btn" data-a="cancel-restore">Cancel</button>'+
           '<div class="spacer"></div>'+
           '<button class="btn danger" data-a="do-restore">Replace everything</button></div>';
    } else {
      h += '<p class="note" style="margin:0 0 14px">Counts live on this phone only. To move '+
           "them to another device, save a backup here and restore it there. "+
           "Currently holding "+config.items.length+" items across "+config.categories.length+
           " groups, and "+nDays+" day"+(nDays===1?"":"s")+" of counts.</p>"+
           '<button class="btn wide solid" data-a="do-export">Save a backup file</button>'+
           '<label class="filebtn" style="margin-top:8px">'+
           '<input type="file" accept="application/json,.json" id="f-restore" hidden>'+
           "Restore from a backup file</label>"+
           '<div class="actions"><div class="spacer"></div>'+
           '<button class="btn" data-a="close">Close</button></div>';
    }

  if (s.kind === "item"){
    var it = s.id ? config.items.filter(function(i){ return i.id===s.id; })[0] : null;
    h += "<h2>"+(it?"Edit item":"New item")+"</h2>"+
         '<div style="display:grid;gap:12px">'+
         '<label class="f"><span class="k">Item name</span>'+
         '<input id="f-name" placeholder="e.g. ML" value="'+esc(it?it.name:"")+'"></label>'+

         '<input id="f-price" class="num" inputmode="decimal" placeholder="0.00" value="'+esc(it?it.price:"")+'"></label>'+

         '<div class="spacer"></div><button class="btn" data-a="close">Cancel</button>'+
         '<button class="btn solid" data-a="save-item" data-id="'+(it?it.id:"")+'">Save</button></div>';

  if (s.kind === "cat"){
    var k = config.categories.filter(function(c){ return c.id===s.id; })[0];
    var img = view.draft && view.draft.image !== undefined ? view.draft.image : k.image;
    var ff  = (view.draft && view.draft.focusField) || startField(k.id);
    h += "<h2>Edit group</h2>"+
         '<div class="photo" id="p-photo"'+(img?' style="background-image:url('+img+')"':"")+">"+
         (img?"":"No photo yet")+"</div>"+
         '<div style="display:flex;gap:10px;margin-bottom:14px">'+
         '<label class="filebtn" style="flex:1"><input type="file" accept="image/*" id="f-photo" hidden>'+

         (img?'<button class="btn" data-a="clear-photo">Remove</button>':"")+"</div>"+

         '<button class="'+(ff==="sold"?"on":"")+'" data-a="pick-focus" data-id="sold">Sold</button>'+

         "</div></div>"+
         '<div class="actions">'+
         (config.categories.length>1?'<button class="btn danger" data-a="del-cat" data-id="'+k.id+'">Delete</button>':"")+
         '<div class="spacer"></div><button class="btn" data-a="close">Cancel</button>'+
         '<button class="btn solid" data-a="save-cat" data-id="'+k.id+'">Save</button></div>';
  }

  m.innerHTML = h + "</div></div>";

  if (s.kind === "count") wireCount(s.id);

  if (s.kind === "backup"){
    var fr = document.getElementById("f-restore");
    if (fr) fr.addEventListener("change", function(ev){
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var rd = new FileReader();
      rd.onerror = function(){ notice = "Could not read that file."; render(); };
      rd.onload = function(){
        try {
          var data = JSON.parse(rd.result);
          if (!data.config || !data.config.categories) throw new Error("shape");
          view.pending = {
            data: data,
            items: (data.config.items || []).length,
            cats:  (data.config.categories || []).length,
            days:  Object.keys(data.days || {}).length
          };
          renderSheet();
        } catch(err){
          notice = "That does not look like a Day Count backup.";
          render();
        }
      };
      rd.readAsText(file);
    });
  }
  if (s.kind === "item") setTimeout(function(){ document.getElementById("f-name").focus(); },50);
  if (s.kind === "cat"){
    document.getElementById("f-photo").addEventListener("change", function(ev){
      var f = ev.target.files && ev.target.files[0];
      if (!f) return;
      shrink(f, function(data){
        view.draft = view.draft || {};
        view.draft.image = data;
        view.draft.name = document.getElementById("f-catname").value;
        renderSheet();
      }, function(msg){ notice = msg; render(); });
    });
  }
}

/* In / Out / Sold stay in step: fill any two, the third works itself out */
function wireCount(itemId){
  var item = config.items.filter(function(i){ return i.id===itemId; })[0];
  var fin  = document.getElementById("f-in");
  var fout = document.getElementById("f-out");
  var fsold= document.getElementById("f-sold");
  var fadd = document.getElementById("f-add");
  var wout = document.getElementById("w-out");
  var wsold= document.getElementById("w-sold");
  var lock = "out";            /* which box the user typed in last */

  function num(el){ return Number(el.value) || 0; }
  function blank(el){ return el.value.trim() === ""; }
  function avail(){ return num(fin) + num(fadd); }
  function soldVal(){ return Math.max(0, evalExpr(fsold.value)); }

  function paint(){
    wout.className  = "f" + (lock === "sold" ? " auto" : "");
    wsold.className = "f" + (lock === "out"  ? " auto" : "");
    var sold = soldVal();
    var amt  = sold * (Number(item.price)||0);
    var eq = document.getElementById("sold-eq");
    if (eq) eq.textContent = isExpr(fsold.value) ? "= " + sold : "";
    document.getElementById("p-calc").textContent = sold + " \u00d7 " + money(item.price) +
      (num(fadd) > 0 ? "   (" + num(fin) + " + " + num(fadd) + " out)" : "");
    document.getElementById("p-amt").textContent  = money(amt);
  }

  /* Out typed -> work out Sold. Blank Out means nothing to derive from. */
  function fromOut(){
    if (blank(fout)) fsold.value = "";
    else fsold.value = Math.max(0, avail() - num(fout));
    paint();
  }
  /* Sold typed -> work out Out. Blank Sold means nothing to derive from. */
  function fromSold(){
    if (blank(fsold)) fout.value = "";
    else fout.value = Math.max(0, avail() - soldVal());
    paint();
  }
  /* In typed -> only refresh whichever of the other two already has a number */
  function fromIn(){
    if (lock === "sold" && !blank(fsold)) return fromSold();
    if (!blank(fout))  return fromOut();
    if (!blank(fsold)) return fromSold();
    paint();
  }

  fout.addEventListener("input", function(){ lock = "out";  fromOut(); });
  fsold.addEventListener("input", function(){ lock = "sold"; fromSold(); });
  fin.addEventListener("input", fromIn);
  fadd.addEventListener("input", fromIn);   /* restock reworks the same pair */

  /* the go arrow saves and jumps straight to the next item in the group */
  function advance(){
    var list = config.items.filter(function(i){ return i.catId === item.catId; });
    var at = -1;
    list.forEach(function(x, n){ if (x.id === itemId) at = n; });
    var next = at > -1 ? list[at + 1] : null;
    saveCount(itemId);
    if (next){ view.sheet = { kind:"count", id: next.id }; renderSheet(); }
  }
  fsold.addEventListener("keydown", function(ev){
    if (ev.key === "Enter"){ ev.preventDefault(); advance(); }
  });
  fout.addEventListener("keydown", function(ev){
    if (ev.key === "Enter" && startField(item.catId) === "out"){ ev.preventDefault(); advance(); }
  });
  /* the go arrow works here too, even though tabbing skips this box */
  fadd.addEventListener("keydown", function(ev){
    if (ev.key === "Enter"){ ev.preventDefault(); advance(); }
  });

  var clr = document.getElementById("f-soldclr");
  if (clr) clr.addEventListener("click", function(ev){
    ev.preventDefault();
    fsold.value = ""; lock = "sold"; fromSold();
    fsold.focus();
  });

  paint();
  var first = startField(item.catId) === "out" ? fout : fsold;
  setTimeout(function(){ first.focus(); }, 50);
}

function renderInstall(){
  var el = document.getElementById("install");
  el.innerHTML = deferredInstall
    ? '<div class="install"><p>Add Day Count to your home screen</p>'+
      '<button class="btn sm" data-a="dismiss-install">Not now</button>'+
      '<button class="btn sm solid" data-a="do-install">Install</button></div>'
    : "";
}

/* the most recent earlier day that has a count for this item */
function carryIn(itemId){
  var d = view.date;
  for (var back = 0; back < 30; back++){
    d = shift(d, -1);
    var rec = (days[d] || {})[itemId];
    if (rec && has(rec.inQty)) return { qty: derive(rec).left, date: d };
  }
  return null;
}

function exportBackup(){
  var blob = new Blob([JSON.stringify({
    format: "daycount-backup-1",
    saved: new Date().toISOString(),
    config: config, days: days, sheets: sheets
  }, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "daycount-backup-" + todayKey() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* groups named CG start on Out by default; everything else starts on Sold */
function startField(catId){
  var k = config.categories.filter(function(c){ return c.id === catId; })[0];
  if (!k) return "sold";
  if (k.focusField === "out" || k.focusField === "sold") return k.focusField;
  return String(k.name || "").trim().toUpperCase().indexOf("CG") === 0 ? "out" : "sold";
}

function nextSeq(){
  var e = entriesFor(), top = 0;
  Object.keys(e).forEach(function(k){ top = Math.max(top, Number(e[k].seq) || 0); });
  return top + 1;
}

function saveCount(id){
  var fin = document.getElementById("f-in");
  if (!fin) return;
  days[view.date] = days[view.date] || {};
  var prev = days[view.date][id] || {};
  var addEl = document.getElementById("f-add");
  var sRaw  = document.getElementById("f-sold").value;
  var rec = {
    inQty:   fin.value,
    addQty:  addEl ? addEl.value : "",
    outQty:  document.getElementById("f-out").value,
    soldQty: sRaw.trim() === "" ? "" : String(Math.max(0, evalExpr(sRaw)))
  };
  if (derive(rec).sold > 0){
    /* keep the original stamp so the row doesn't jump when you edit it later */
    rec.seq = prev.seq || nextSeq();
  }
  days[view.date][id] = rec;
  saveDays();
  view.sheet = null;
  render();
}

/* ---------------- events ---------------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-a]");
  if (!t) return;
  var a = t.dataset.a, id = t.dataset.id;
  if (a === "close-scrim" && ev.target !== t) return;

  switch(a){
    case "tab":         view.tab = id; view.editing = false; break;
    case "home":        view.cat = null; view.editing = false; break;
    case "toggle-edit": view.editing = !view.editing; break;
    case "prev":        view.date = shift(view.date,-1); break;
    case "next":        if (view.date < todayKey()) view.date = shift(view.date,1); break;
    case "open-cat":    view.cat = id; break;
    case "edit-cat":    view.draft = null; view.sheet = {kind:"cat", id:id}; break;
    case "add-cat":
      config.categories.push({ id:uid(), name:"New group", image:null }); saveConfig(); break;
    case "move-up": case "move-down":
      (function(){
        var me = config.items.filter(function(i){ return i.id === id; })[0];
        if (!me) return;
        var sibs = config.items.filter(function(i){ return i.catId === me.catId; });
        var at = sibs.indexOf(me);
        var to = a === "move-up" ? at - 1 : at + 1;
        if (to < 0 || to >= sibs.length) return;
        var A = config.items.indexOf(sibs[at]);
        var B = config.items.indexOf(sibs[to]);
        var tmp = config.items[A]; config.items[A] = config.items[B]; config.items[B] = tmp;
        saveConfig();
      })();
      break;

    case "add-extra":
      config.extras = config.extras || [];
      config.extras.push({ id:uid(), name:"New box" });
      saveConfig(); break;
    case "del-extra":
      config.extras = (config.extras || []).filter(function(x){ return x.id !== id; });
      saveConfig(); break;
    case "count":       view.sheet = {kind:"count", id:id}; break;
    case "out-list":    view.sheet = {kind:"outlist"}; break;
    case "backup":      view.pending = null; view.sheet = {kind:"backup"}; break;
    case "cancel-restore": view.pending = null; break;
    case "do-export":   exportBackup(); return;
    case "do-restore":
      if (view.pending){
        var d = view.pending.data;
        config = d.config;
        days   = d.days   || {};
        sheets = d.sheets || {};
        saveConfig(); saveDays(); saveSheets();
        view.pending = null; view.sheet = null; view.cat = null;
      }
      break;
    case "edit-item":   view.sheet = {kind:"item", id:id}; break;
    case "new-item":    view.sheet = {kind:"item", id:null}; break;
    case "close": case "close-scrim": view.sheet = null; view.draft = null; break;

    case "save-count": saveCount(id); break;

    case "save-item":
      var nm = document.getElementById("f-name").value.trim();
      var pr = Number(document.getElementById("f-price").value) || 0;
      if (!nm) return;
      if (id){
        config.items = config.items.map(function(i){
          return i.id===id ? {id:i.id,catId:i.catId,name:nm,price:pr} : i; });
      } else {
        config.items.push({ id:uid(), catId:view.cat, name:nm, price:pr });
      }
      saveConfig(); view.sheet = null; break;

    case "del-item":
      config.items = config.items.filter(function(i){ return i.id!==id; });
      saveConfig(); view.sheet = null; break;

    case "pick-focus":
      view.draft = view.draft || {};
      view.draft.focusField = id;
      view.draft.name = document.getElementById("f-catname").value;
      renderSheet(); return;

    case "cash-op":
      var cb = document.getElementById("r-cash");
      if (cb){
        if (id === "C") cb.value = "";
        else {
          var v = cb.value.replace(/[+\-*\/]$/, "");   /* swap a trailing operator */
          cb.value = v === "" ? "" : v + id;
        }
        sheets[view.date] = sheets[view.date] || {};
        sheets[view.date].cash = cb.value;
        saveSheets();
        document.getElementById("r-total").textContent = money(reportTotal());
        paintCashEq(); paintDiff(); renderBar(null);
        cb.focus();
        try { var n = cb.value.length; cb.setSelectionRange(n, n); } catch(e){}
      }
      return;

    case "clear-photo":
      view.draft = view.draft || {};
      view.draft.image = null;
      view.draft.name = document.getElementById("f-catname").value;
      renderSheet(); return;

    case "save-cat":
      var cname = document.getElementById("f-catname").value.trim();
      var cimg = view.draft && view.draft.image !== undefined ? view.draft.image : undefined;
      var cff  = (view.draft && view.draft.focusField) || undefined;
      config.categories = config.categories.map(function(k){
        if (k.id !== id) return k;
        return {
          id: k.id,
          name: cname || k.name,
          image: cimg !== undefined ? cimg : k.image,
          focusField: cff || k.focusField || startField(k.id)
        };
      });
      saveConfig(); view.sheet = null; view.draft = null; break;

    case "del-cat":
      config.categories = config.categories.filter(function(k){ return k.id!==id; });
      config.items = config.items.filter(function(i){ return i.catId!==id; });
      saveConfig(); view.sheet = null; if (view.cat===id) view.cat = null; break;

    case "do-install":
      if (deferredInstall){ deferredInstall.prompt(); deferredInstall = null; }
      break;
    case "dismiss-install": deferredInstall = null; break;
  }
  render();
});

/* tapping a box selects what's there, so the first digit typed replaces it.
   the cash box is the exception - it builds up an expression, so the caret
   just goes to the end and nothing is wiped out. */
document.addEventListener("focusin", function(ev){
  var el = ev.target;
  if (!el || el.tagName !== "INPUT" || el.type === "file") return;
  setTimeout(function(){
    try {
      if (el.id === "r-cash" || el.id === "f-sold"){
        var n = el.value.length; el.setSelectionRange(n, n);
      } else el.select();
    } catch(e){}
  }, 0);
});

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferredInstall = e; renderInstall();
});
window.addEventListener("appinstalled", function(){ deferredInstall = null; renderInstall(); });

document.addEventListener("visibilitychange", function(){
  if (!document.hidden && view.date < todayKey() && !view.sheet){ view.date = todayKey(); render(); }
});

load();
render();

if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
